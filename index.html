<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>网站维护中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .maintenance-card {
            max-width: 550px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: all 0.2s ease;
        }

        .icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: inline-block;
            animation: subtle-pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 28px;
            color: #1f2937;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .sub {
            font-size: 16px;
            color: #4b5563;
            margin-bottom: 32px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 20px;
        }

        .info-panel {
            background: #f3f4f6;
            border-radius: 24px;
            padding: 20px 20px;
            margin-bottom: 28px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 16px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .label {
            font-weight: 600;
            color: #374151;
            background: #e5e7eb;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 14px;
        }

        .value {
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            font-weight: 500;
            color: #111827;
            word-break: break-all;
            text-align: right;
        }

        .duration {
            background: #1e293b;
            color: white;
            border-radius: 60px;
            padding: 14px 16px;
            margin-top: 8px;
            font-family: monospace;
            font-weight: 600;
            font-size: 22px;
            letter-spacing: 1px;
            text-align: center;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.05);
        }

        .duration-label {
            font-size: 13px;
            font-weight: normal;
            opacity: 0.8;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .note {
            font-size: 13px;
            color: #6b7280;
            background: #f9fafb;
            padding: 14px 16px;
            border-radius: 20px;
            margin-top: 12px;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
        }

        @keyframes subtle-pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        @media (max-width: 480px) {
            .maintenance-card {
                padding: 28px 20px;
            }
            .duration {
                font-size: 18px;
                padding: 12px;
            }
            .info-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="icon">🛠️⚙️</div>
        <h1>系统升级维护中</h1>
        <div class="sub">为了给您提供更稳定的服务，网站正在进行例行维护</div>

        <div class="info-panel">
            <div class="info-row">
                <span class="label">维护开始时间</span>
                <span class="value" id="startTimeDisplay">-- 加载中 --</span>
            </div>
            <div class="info-row">
                <span class="label">当前时间</span>
                <span class="value" id="currentTimeDisplay">--:--:--</span>
            </div>
            <div class="duration" id="durationBox">
                <span class="duration-label">⏳ 已持续</span>
                <span id="durationText">计算中...</span>
            </div>
        </div>

        <div class="note">
            🔔 预计很快恢复，请稍后再试。<br>
           
        </div>
        <footer>感谢理解</footer>
    </div>

    <script>
        // ======================= 配置区域 =======================
        // 请修改下面的时间为实际的维护开始时间（年, 月, 日, 时, 分, 秒）
        // 注意：月份从0开始，1月对应0，2月对应1，以此类推。
        // 示例：2025年4月7日 14:30:00
        // const MAINTENANCE_START = new Date(2025, 3, 7, 14, 30, 0);   // 3 代表四月
        
        // 👇 请在下面填写真实的维护开始时间（修改为你的实际时间）
        const MAINTENANCE_START = new Date(2026, 4, 16, 22, 30, 0);
        // ======================================================
        
        // 格式化数字补零
        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        // 格式化日期时间: YYYY-MM-DD HH:MM:SS
        function formatDateTime(date) {
            const year = date.getFullYear();
            const month = pad(date.getMonth() + 1);
            const day = pad(date.getDate());
            const hours = pad(date.getHours());
            const minutes = pad(date.getMinutes());
            const seconds = pad(date.getSeconds());
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 计算持续时间 (毫秒) -> 返回友好字符串
        function formatDuration(ms) {
            if (ms < 0) return "尚未开始或时间设置有误";
            const secondsTotal = Math.floor(ms / 1000);
            const days = Math.floor(secondsTotal / 86400);
            const hours = Math.floor((secondsTotal % 86400) / 3600);
            const minutes = Math.floor((secondsTotal % 3600) / 60);
            const seconds = secondsTotal % 60;

            const parts = [];
            if (days > 0) parts.push(`${days}天`);
            if (hours > 0) parts.push(`${hours}小时`);
            if (minutes > 0) parts.push(`${minutes}分钟`);
            if (seconds > 0 || parts.length === 0) parts.push(`${seconds}秒`);
            
            return parts.join(' ');
        }

        // 更新时间显示
        function updateDisplay() {
            const now = new Date();
            // 显示开始时间
            const startTimeEl = document.getElementById('startTimeDisplay');
            if (startTimeEl) {
                startTimeEl.textContent = formatDateTime(MAINTENANCE_START);
            }
            // 显示当前时间
            const currentTimeEl = document.getElementById('currentTimeDisplay');
            if (currentTimeEl) {
                currentTimeEl.textContent = formatDateTime(now);
            }
            // 计算持续时长
            const elapsed = now - MAINTENANCE_START;
            const durationTextEl = document.getElementById('durationText');
            if (durationTextEl) {
                let durationStr = formatDuration(elapsed);
                if (elapsed < 0) {
                    durationStr = "⏱️ 尚未开始 (已预告维护)";
                }
                durationTextEl.textContent = durationStr;
            }
        }
        
        // 立即执行一次，然后每秒刷新
        updateDisplay();
        setInterval(updateDisplay, 1000);
    </script>
</body>
</html>
